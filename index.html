<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP CHANNEL BY DAVID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0f172a, #020617);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            margin-bottom: 15px;
        }

        /* Pure CSS Se Banaya Gaya Custom Logo Banner */
        .logo-box {
            width: 130px;
            height: 130px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle, #020617, #0f172a);
            border: 3px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .crown-icon {
            font-size: 34px;
            line-height: 1;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 8px #ffd700);
        }

        .logo-text-david {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
            line-height: 1;
        }

        .logo-text-channel {
            font-size: 9px;
            font-weight: 700;
            color: #00d2ff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-top: 15px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #00d2ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .features {
            text-align: left;
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-item span {
            color: #38ef7d;
            margin-right: 12px;
            font-size: 18px;
        }

        .cta-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        .cta-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.9);
        }

        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 198, 255, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(0, 198, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 198, 255, 0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Self-Contained Built-in Logo Structure -->
        <div class="logo-container">
            <div class="logo-box">
                <div class="crown-icon">👑</div>
                <div class="logo-text-david">DAVID</div>
                <div class="logo-text-channel">CHANNEL</div>
            </div>
        </div>

        <h1>VIP CHANNEL BY DAVID</h1>
        <div class="subtitle">Official Premium Access</div>

        <div class="features">
            <div class="feature-item">
                <span>⚡</span> 100% High-Accuracy Signals
            </div>
            <div class="feature-item">
                <span>📊</span> Daily Market Updates & Analysis
            </div>
            <div class="feature-item">
                <span>🔔</span> Zero-Delay Instant Notifications
            </div>
            <div class="feature-item">
                <span>💎</span> Exclusive Insider VIP Access
            </div>
        </div>

        <!-- Apna Telegram Link Yahan Badlein -->
        <a href="YOUR_TELEGRAM_LINK_HERE" class="cta-btn" target="_blank">
            👉 JOIN VIP CHANNEL NOW 👈
        </a>

        <div class="footer-note">
            ⚠️ Limited Free Access – Join Before Link Expires!
        </div>
    </div>

</body>
</html>
